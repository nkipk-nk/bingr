name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Dummy values — this only needs to exercise the bundler, not talk
          # to real services. Vite inlines these at build time; real secrets
          # live in Vercel's project env vars for the actual deploy.
          VITE_TMDB_API_KEY: ci-placeholder
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
          VITE_SENTRY_DSN: ""
